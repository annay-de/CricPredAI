[server]
headless = true
enableCORS = false
enableXsrfProtection = false
port = 8501
enableWebsocketCompression = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#D6F546"
backgroundColor = "#0B0F0C"
secondaryBackgroundColor = "#11160F"
textColor = "#EDEAD9"
font = "sans serif"

# The app is designed for one look only: night match. Pin the same palette
# for both variants so system light mode cannot flip widgets to white.
[theme.light]
primaryColor = "#D6F546"
backgroundColor = "#0B0F0C"
secondaryBackgroundColor = "#11160F"
textColor = "#EDEAD9"
font = "sans serif"

[theme.dark]
primaryColor = "#D6F546"
backgroundColor = "#0B0F0C"
secondaryBackgroundColor = "#11160F"
textColor = "#EDEAD9"
font = "sans serif"
