[server]
headless = true
enableCORS = false
enableXsrfProtection = false
port = 8501
enableWebsocketCompression = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#1954EC"
backgroundColor = "#070708"
secondaryBackgroundColor = "#101012"
textColor = "#FFFFFF"
font = "sans serif"

# The app is designed for one look only: midnight. Pin the same palette
# for both variants so system light mode cannot flip widgets to white.
[theme.light]
primaryColor = "#1954EC"
backgroundColor = "#070708"
secondaryBackgroundColor = "#101012"
textColor = "#FFFFFF"
font = "sans serif"

[theme.dark]
primaryColor = "#1954EC"
backgroundColor = "#070708"
secondaryBackgroundColor = "#101012"
textColor = "#FFFFFF"
font = "sans serif"
